/* ============ 도안 뷰어 ============ */
const vw = {pdf:null, pattern:null, projectId:null, zoom:1, url:null, observer:null, saveT:null, cur:1};
async function openViewer(patternId, projectId){
  const p = byId('patterns', patternId); if(!p || !p.fileId) return;
  let rec = await idb.get(p.fileId).catch(() => null);
  if(!rec && db.settings.gdOn){ try{ rec = await gdFetchPattern(p); }catch(e){ rec = null; } }
  if(!rec){ toast(db.settings.gdOn ? '드라이브에서 도안을 받지 못했어요. 인터넷 연결을 확인하거나 도안을 올린 기기에서 먼저 동기화해 주세요.' : '이 기기에 도안 파일이 없어요. 백업에서 불러오거나 파일을 다시 올려 주세요.'); return; }
  Object.assign(vw, {pattern: p, projectId: projectId || null, zoom: 1, cur: p.lastPage || 1});
  if(vw.url) URL.revokeObjectURL(vw.url);
  vw.url = URL.createObjectURL(rec.blob.type ? rec.blob : new Blob([rec.blob], {type: rec.type || 'application/pdf'}));
  p.lastOpened = Date.now(); save();
  const v = $('#viewer');
  v.hidden = false; document.body.style.overflow = 'hidden';
  keepAwake(true);
  $('#vTitle').textContent = p.name;
  $('#vOpen').href = vw.url;
  renderViewerCounter();
  renderMarkBar();
  const pages = $('#vPages');
  pages.innerHTML = `<div class="vmsg">${mascot('happy', 90)}도안을 펼치는 중…</div>`;
  if(vw.pdf){ vw.pdf.destroy(); vw.pdf = null; }
  if(p.fileType !== 'pdf'){
    $('#vPageInfo').textContent = '';
    pages.innerHTML = `<div class="vpage vimgwrap" data-page="1"><img class="vimg" id="vImg" src="${vw.url}" alt="${esc(p.name)}"></div>`;
    applyImgZoom();
    $('#vImg').onload = () => { renderMarker(); if(p.marker && p.marker.on) scrollToMarker(true); };
    return;
  }
  try{
    const lib = await loadPdfJs();
    vw.pdf = await lib.getDocument({data: new Uint8Array(await rec.blob.arrayBuffer())}).promise;
    if(!p.pages){ p.pages = vw.pdf.numPages; save(); }
    await buildPages();
    if(p.marker && p.marker.on){ scrollToMarker(true); toast('📍 지난번에 뜨던 곳을 표시해 뒀어요'); }
  }catch(e){
    pages.innerHTML = `<div class="vmsg">이 화면에서 PDF를 펼치지 못했어요 (인터넷 연결이 필요해요).<br><br><a class="btn primary" href="${vw.url}" target="_blank" rel="noopener">브라우저 기본 뷰어로 열기</a></div>`;
  }
}
async function buildPages(noScroll){
  const pdf = vw.pdf, box = $('#vPages');
  if(vw.observer) vw.observer.disconnect();
  const first = await pdf.getPage(1);
  const vp1 = first.getViewport({scale: 1});
  const width = baseWidth() * vw.zoom;
  const scale = width / vp1.width;
  box.innerHTML = Array.from({length: pdf.numPages}, (_, i) =>
    `<div class="vpage" data-page="${i+1}" style="width:${width}px;height:${vp1.height * scale}px"><span class="vnum">${i+1}</span></div>`).join('');
  $('#vZoom').textContent = Math.round(vw.zoom * 100) + '%';
  vw.observer = new IntersectionObserver(entries => entries.forEach(en => { if(en.isIntersecting) renderPage(en.target, scale); }), {root: box, rootMargin: '800px 0px'});
  $$('.vpage', box).forEach(el => vw.observer.observe(el));
  renderMarker();
  if(!noScroll) goPage(vw.cur, true);
}
async function renderPage(el, scale){
  if(el.dataset.done === String(scale)) return;
  el.dataset.done = String(scale);
  const page = await vw.pdf.getPage(+el.dataset.page);
  const vp = page.getViewport({scale});
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const cv = document.createElement('canvas');
  cv.width = vp.width * dpr; cv.height = vp.height * dpr;
  cv.style.width = vp.width + 'px'; cv.style.height = vp.height + 'px';
  el.style.height = vp.height + 'px';
  await page.render({canvasContext: cv.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr,0,0,dpr,0,0] : null}).promise;
  el.querySelector('canvas')?.remove();
  el.prepend(cv);
}
function goPage(n, instant){
  const total = vw.pdf ? vw.pdf.numPages : 1;
  n = Math.max(1, Math.min(total, n));
  const el = $(`.vpage[data-page="${n}"]`); if(!el) return;
  $('#vPages').scrollTo({top: el.offsetTop - 8, behavior: instant ? 'auto' : 'smooth'});
  setCurPage(n);
}
function setCurPage(n){
  vw.cur = n;
  $('#vPageInfo').textContent = vw.pdf ? `${n} / ${vw.pdf.numPages}` : '';
  clearTimeout(vw.saveT);
  vw.saveT = setTimeout(() => { if(vw.pattern && vw.pattern.lastPage !== n){ vw.pattern.lastPage = n; save(); } }, 500);
}
function applyImgZoom(){
  const w = $('.vimgwrap'); if(w) w.style.width = baseWidth() * vw.zoom + 'px';
  $('#vZoom').textContent = Math.round(vw.zoom * 100) + '%';
}

/* ---------- 📍 지금 뜨는 곳 표시 (도안 위 형광 띠) ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function pageCount(){ return vw.pdf ? vw.pdf.numPages : 1; }
function mk(){ return vw.pattern && vw.pattern.marker; }
function saveMarker(){ clearTimeout(vw.mT); vw.mT = setTimeout(save, 300); }
function renderMarker(){
  $$('.vmark, .vmark-shade').forEach(e => e.remove());
  const m = mk();
  renderMarkBar();
  if(!m || !m.on) return;
  const page = $(`.vpage[data-page="${m.page}"]`); if(!page) return;
  page.insertAdjacentHTML('beforeend', `<div class="vmark-shade" style="height:${m.y * 100}%"></div>
    <div class="vmark" style="top:${m.y * 100}%;height:${m.h * 100}%">
      <span class="vmark-tag">📍 지금 여기</span><span class="vmark-grip" title="끌어서 높이 조절"></span></div>`);
  bindMarkerDrag(page.querySelector('.vmark'), page);
}
function bindMarkerDrag(el, page){
  let mode = null, startY = 0, start = null;
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    mode = e.target.classList.contains('vmark-grip') ? 'resize' : 'move';
    startY = e.clientY; start = {...mk()};
    el.setPointerCapture(e.pointerId); el.classList.add('dragging');
  });
  el.addEventListener('pointermove', e => {
    if(!mode) return;
    const m = mk(), dy = (e.clientY - startY) / page.offsetHeight;
    if(mode === 'move') m.y = clamp(start.y + dy, 0, 1 - m.h);
    else m.h = clamp(start.h + dy, 0.008, 0.5 - 0);
    el.style.top = m.y * 100 + '%'; el.style.height = m.h * 100 + '%';
    const sh = page.querySelector('.vmark-shade'); if(sh) sh.style.height = m.y * 100 + '%';
  });
  const end = () => { if(!mode) return; mode = null; el.classList.remove('dragging'); saveMarker(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function placeMarker(pageNo, fy){
  const old = mk() || {};
  const h = old.h || 0.04;
  vw.pattern.marker = {page: pageNo, y: clamp(fy - h / 2, 0, 1 - h), h, on: true, follow: !!old.follow};
  renderMarker(); saveMarker();
}
function placeMarkerAtView(){
  const box = $('#vPages'), target = box.scrollTop + box.clientHeight * 0.4;
  let page = $('.vpage', box); if(!page) return;
  for(const el of $$('.vpage', box)){ if(el.offsetTop <= target) page = el; else break; }
  placeMarker(+page.dataset.page, clamp((target - page.offsetTop) / page.offsetHeight, 0, 1));
}
function moveMarker(dir){
  const m = mk(); if(!m || !m.on) return;
  let y = m.y + dir * m.h, page = m.page;
  if(y + m.h > 1.0001){ if(page < pageCount()){ page++; y = 0.02; } else { y = 1 - m.h; toast('마지막 줄이에요'); } }
  else if(y < -0.0001){ if(page > 1){ page--; y = 1 - m.h - 0.02; } else { y = 0; } }
  const turned = page !== m.page;
  m.y = y; m.page = page;
  renderMarker(); saveMarker();
  scrollToMarker(false, !turned);
  if(turned) toast(`${page}쪽으로 넘어갔어요`);
}
function scrollToMarker(instant, onlyIfHidden){
  const m = mk(); if(!m) return;
  const page = $(`.vpage[data-page="${m.page}"]`); if(!page) return;
  const box = $('#vPages');
  const top = page.offsetTop + m.y * page.offsetHeight, bottom = top + m.h * page.offsetHeight;
  if(onlyIfHidden && top > box.scrollTop + box.clientHeight * 0.15 && bottom < box.scrollTop + box.clientHeight * 0.85) return;
  box.scrollTo({top: top - box.clientHeight * 0.35, behavior: instant ? 'auto' : 'smooth'});
}
function renderMarkBar(){
  const m = mk(), on = m && m.on, hasProj = !!getOwner(viewerOwnerKey());
  $('#vMarkBar').innerHTML = on ? `
    <button class="mb" data-action="mMove" data-d="-1" aria-label="한 칸 위로">▲</button>
    <button class="mb main" data-action="mMove" data-d="1" aria-label="한 칸 아래로">▼ 다음 줄</button>
    <button class="mb" data-action="mGo" title="표시한 곳으로 이동">🎯 찾기</button>
    <button class="mb" data-action="mHere" title="지금 보이는 화면 가운데로 표시 옮기기">📍 여기로</button>
    ${hasProj ? `<button class="mb ${m.follow ? 'on' : ''}" data-action="mFollow" title="카운터 ＋/− 할 때 표시도 함께 이동">🔗 카운터 연동 ${m.follow ? '켜짐' : '꺼짐'}</button>` : ''}
    <button class="mb" data-action="mToggle" title="표시 숨기기">숨기기</button>`
    : `<button class="mb main" data-action="mToggle">📍 지금 뜨는 곳 표시하기</button>`;
}
/* 화면 왼쪽·오른쪽 가장자리(각 15%)를 톡 누르면 이전·다음 쪽.
   (실수로 표시 띠가 옮겨지지 않도록 두 번 탭으로 옮기는 기능은 없앴어요) */
$('#vPages').addEventListener('click', e => {
  if(!vw.pdf || e.target.closest('.vmark') || e.target.closest('a,button')) return;
  const r = $('#vPages').getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
  const dir = x < 0.15 ? -1 : x > 0.85 ? 1 : 0;
  if(!dir) return;
  goPage(vw.cur + dir);
  const h = $(dir < 0 ? '#vEdgeL' : '#vEdgeR'); h.classList.add('show'); setTimeout(() => h.classList.remove('show'), 350);
});
/* 100% = 화면 너비에 맞춤 (태블릿 가로 화면에서도 넓게, 최대 1400px) */
function baseWidth(){ return Math.min($('#vPages').clientWidth - 40, 1400); }
/* focal: 확대 중심점 {x,y} (vPages 기준 화면 좌표). 그 지점이 제자리에 남도록 스크롤 보정 */
function setZoom(z, focal){
  const box = $('#vPages'), oldZ = vw.zoom;
  vw.zoom = Math.max(0.5, Math.min(4, Math.round(z * 100) / 100));
  const k = vw.zoom / oldZ;
  const f = focal || {x: box.clientWidth / 2, y: box.clientHeight / 2};
  const cx = box.scrollLeft + f.x, cy = box.scrollTop + f.y;
  const restore = () => { box.scrollLeft = cx * k - f.x; box.scrollTop = cy * k - f.y; };
  if(vw.pattern.fileType !== 'pdf'){ applyImgZoom(); restore(); return; }
  if(z === 1 && !focal){ const keep = vw.cur; buildPages().then(() => goPage(keep, true)); return; }
  buildPages(true).then(restore);
}

/* ---------- 두 손가락으로 확대·축소 (태블릿) ---------- */
(() => {
  const box = $('#vPages');
  let pinch = null;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  box.addEventListener('touchstart', e => {
    if(e.touches.length !== 2 || e.target.closest('.vmark')) return;
    const r = box.getBoundingClientRect();
    pinch = {d0: dist(e.touches), x: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, y: (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top, k: 1};
    box.style.transformOrigin = `${pinch.x}px ${pinch.y}px`;
  }, {passive: true});
  box.addEventListener('touchmove', e => {
    if(!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    pinch.k = Math.max(0.5 / vw.zoom, Math.min(4 / vw.zoom, dist(e.touches) / pinch.d0));
    box.style.transform = `scale(${pinch.k})`;   /* 손을 떼기 전까지는 미리보기로 확대 */
  }, {passive: false});
  const end = () => {
    if(!pinch) return;
    const p = pinch; pinch = null;
    box.style.transform = ''; box.style.transformOrigin = '';
    if(Math.abs(p.k - 1) > 0.04) setZoom(vw.zoom * p.k, {x: p.x, y: p.y});
  };
  box.addEventListener('touchend', e => { if(e.touches.length < 2) end(); });
  box.addEventListener('touchcancel', end);
  /* PC: Ctrl + 마우스 휠로 확대 */
  box.addEventListener('wheel', e => {
    if(!e.ctrlKey) return; e.preventDefault();
    const r = box.getBoundingClientRect();
    clearTimeout(vw.wheelT);
    vw.wheelK = (vw.wheelK || 1) * (e.deltaY < 0 ? 1.1 : 0.9);
    vw.wheelT = setTimeout(() => { const k = vw.wheelK; vw.wheelK = 1; setZoom(vw.zoom * k, {x: e.clientX - r.left, y: e.clientY - r.top}); }, 120);
  }, {passive: false});
})();

/* ---------- 도안 보는 동안 화면 꺼짐 방지 ---------- */
let wakeLock = null;
async function keepAwake(on){
  try{
    if(on && 'wakeLock' in navigator && db.settings.wake !== false && !document.hidden){ if(!wakeLock) wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    else if(!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  }catch(e){ wakeLock = null; }
}
document.addEventListener('visibilitychange', () => { if(!document.hidden && !$('#viewer').hidden) keepAwake(true); });
function toggleFullscreen(){
  if(document.fullscreenElement) document.exitFullscreen();
  else (document.documentElement.requestFullscreen || function(){ toast('이 브라우저는 전체 화면을 지원하지 않아요'); }).call(document.documentElement).catch?.(() => {});
}
/* 카운터 주인: 프로젝트 id 또는 'pat:<도안id>' (프로젝트 없이 도안만 열었을 때) */
function getOwner(key){
  if(!key) return null;
  if(String(key).startsWith('pat:')){
    const pt = byId('patterns', key.slice(4)); if(!pt) return null;
    if(!pt.counters) pt.counters = [{id: uid(), name:'단', value:0, target:0, repeat:0}, {id: uid(), name:'늘림', value:0, target:0, repeat:0}];
    return pt;
  }
  return byId('projects', key);
}
function viewerOwnerKey(){ return vw.projectId || (vw.pattern && 'pat:' + vw.pattern.id); }
/* 반복(늘림·줄임·무늬) 안내: n단마다 → 다음이 몇 단 뒤인지 */
function repeatInfo(c){
  const rep = num(c.repeat); if(!rep) return '';
  const k = rep - (c.value % rep);
  return `🔁 ${rep}단마다 · ${k === 1 ? '<b class="rep-now">다음 단이에요 ✨</b>' : `${k}단 뒤`}`;
}
/* 도안 뷰어 아래 카운터 패널 (단·늘림 등 전부) */
function renderViewerCounter(){
  const box = $('#vCounters'); if(!box) return;
  const key = viewerOwnerKey(), o = getOwner(key);
  if(!o){ box.innerHTML = ''; return; }
  if(db.settings.vcHide){ box.innerHTML = `<button class="vc-toggle" data-action="vcToggle">🧮 카운터 펼치기</button>`; return; }
  const proj = vw.projectId && byId('projects', vw.projectId);
  box.innerHTML = `<div class="vc-head"><span class="small muted">${proj ? `🧶 ${esc(proj.name)}${proj.curPart ? ` · <b>${esc(proj.curPart)}</b> 뜨는 중` : ''}` : '📖 이 도안 카운터'}</span>
      <span><button class="vc-mini" data-action="vcAdd">＋ 카운터</button><button class="vc-mini" data-action="vcToggle">접기</button></span></div>
    <div class="vc-list">${o.counters.map(c => `<div class="vc">
      <div class="vc-top"><span class="vc-name">${esc(c.name)}</span><button class="vc-gear" data-action="vcEdit" data-cid="${c.id}" aria-label="설정">⚙</button></div>
      <div class="vc-row">

        <b>${c.value}${c.target ? `<small>/${c.target}</small>` : ''}</b>
        <button class="plus" data-action="vCount" data-cid="${c.id}" data-d="1" aria-label="더하기">＋</button>
      </div>
      <div class="vc-sub">${c.target ? `${c.value >= c.target ? '🎯 목표 달성!' : `목표까지 ${c.target - c.value}`}` : ''}${c.target && c.repeat ? ' · ' : ''}${repeatInfo(c)}</div>
    </div>`).join('')}</div>`;
}
function closeViewer(){
  $('#viewer').hidden = true; document.body.style.overflow = '';
  keepAwake(false);
  if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if(vw.observer) vw.observer.disconnect();
  if(vw.pdf){ vw.pdf.destroy(); vw.pdf = null; }
  $('#vPages').innerHTML = '';
  if(vw.pattern){ vw.pattern.lastPage = vw.cur; save(); }
  refresh();
}
$('#vPages').addEventListener('scroll', () => {
  if(!vw.pdf) return;
  const box = $('#vPages'), mid = box.scrollTop + box.clientHeight * 0.35;
  let n = 1;
  for(const el of $$('.vpage', box)){ if(el.offsetTop <= mid) n = +el.dataset.page; else break; }
  if(n !== vw.cur) setCurPage(n);
}, {passive: true});
window.addEventListener('resize', () => { if(!$('#viewer').hidden && vw.pdf){ clearTimeout(vw.rt); vw.rt = setTimeout(() => setZoom(vw.zoom), 250); } });

/* ============ 폼 (모달) ============ */
let formCtx = null;
function fieldHTML(f, v){
  if(f.type === 'heading') return `<div class="field full form-heading">${f.label}</div>`;
  if(f.type === 'html') return `<div class="field full">${f.html}</div>`;
  const val = v[f.key];
  const req = f.required ? 'required' : '';
  let input = '';
  switch(f.type){
    case 'select': input = `<select name="${f.key}">${f.options.map(([k,l]) => `<option value="${esc(k)}" ${String(val ?? '') === String(k) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`; break;
    case 'textarea': input = `<textarea name="${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>`; break;
    case 'number': input = `<input type="number" inputmode="decimal" step="${f.step||'any'}" min="0" name="${f.key}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}" ${req}>`; break;
    case 'date': input = `<input type="date" name="${f.key}" value="${esc(val)}">`; break;
    case 'color': input = `<input type="color" name="${f.key}" value="${esc(val || '#cccccc')}">`; break;
    case 'checks': input = f.options.length ? `<div class="checklist">${f.options.map(([k,l]) => `<label><input type="checkbox" name="${f.key}" value="${k}" ${(val||[]).includes(k)?'checked':''}> ${esc(l)}</label>`).join('')}</div>` : `<span class="hint">${f.emptyText}</span>`; break;
    case 'yarnUses':
      if(!db.yarns.length){ input = `<span class="hint">보관함에 등록된 실이 없어요. 실·바늘 보관함에서 먼저 추가하세요.</span>`; break; }
      input = `<div id="yuseList">${(val||[]).map(u => yuseRow(u, f.pid)).join('')}</div><button type="button" class="btn sm" data-action="addYuse" data-pid="${f.pid||''}">＋ 실 추가</button>`; break;
    case 'image': input = `<div class="row"><input type="file" accept="image/*" data-img="${f.key}"><input type="hidden" name="${f.key}" value="${esc(val||'')}">
      <span id="imgPrevWrap" style="width:64px;height:64px;border-radius:10px;overflow:hidden;${val?'':'display:none'}">${val ? imgTag(val) : '<img alt="">'}</span>
      ${val ? `<button type="button" class="btn sm ghost" data-action="clearImg">사진 지우기</button>` : ''}</div><span class="hint">사진은 저장 공간을 아끼기 위해 자동으로 줄여서 저장해요.</span>`; break;
    default: input = `<input type="text" name="${f.key}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}" ${req}>`;
  }
  return `<div class="field ${f.full?'full':''}"><label>${f.label}${f.required?' <span style="color:var(--accent)">*</span>':''}</label>${input}${f.hint ? `<span class="hint">${f.hint}</span>` : ''}</div>`;
}
function yuseRow(u, pid){
  return `<div class="yuse"><select name="yu_yarn">${db.yarns.map(y => {
    const left = num(y.skeins) - yarnUsed(y.id, pid);
    return `<option value="${y.id}" ${u.yarnId===y.id?'selected':''}>${esc(yarnLabel(y))} (남음 ${fmt(left)}볼)</option>`;}).join('')}</select>
    <input type="number" step="0.5" min="0" name="yu_sk" value="${esc(u.skeins ?? 1)}" aria-label="볼 수" title="볼 수"><button type="button" class="btn sm ghost" data-action="rmRow" aria-label="삭제">✕</button></div>`;
}
function openForm(title, fields, values, onSave, validate){
  formCtx = {fields, onSave};
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog" id="theForm" novalidate>
    <div class="dlg-head"><h2>${title}</h2><button type="button" class="icon-btn" data-action="closeDlg" aria-label="닫기">✕</button></div>
    <div class="dlg-body"><div class="form-grid">${fields.map(f => fieldHTML(f, values || {})).join('')}</div></div>
    <div class="dlg-foot"><button type="button" class="btn" data-action="closeDlg">취소</button><button type="submit" class="btn primary">저장</button></div>
  </form>`;
  dlg.showModal();
  hydrateImages(dlg);
  const first = $('input[type=text],input[type=number]', dlg); if(first && window.innerWidth > 820) first.focus();
  $('#theForm').addEventListener('submit', e => {
    e.preventDefault();
    const form = e.target;
    for(const f of fields){
      if(f.required){ const el = form.elements[f.key]; if(el && !String(el.value).trim()){ el.focus(); el.style.borderColor = 'var(--accent)'; toast(`'${f.label}'을(를) 입력해 주세요`); return; } }
    }
    const vals = {};
    fields.forEach(f => {
      if(!f.key) return;
      if(f.type === 'checks') vals[f.key] = $$(`input[name="${f.key}"]:checked`, form).map(i => i.value);
      else if(f.type === 'yarnUses'){
        const ys = $$('[name=yu_yarn]', form), ss = $$('[name=yu_sk]', form);
        vals[f.key] = ys.map((s,i) => ({yarnId: s.value, skeins: num(ss[i].value)})).filter(u => u.yarnId);
      }
      else if(form.elements[f.key]) vals[f.key] = form.elements[f.key].value.trim();
    });
    const err = validate && validate(vals);
    if(err) return toast(err);
    dlg.close();
    onSave(vals);
  });
  $$('[data-img]', dlg).forEach(inp => inp.addEventListener('change', async () => {
    const file = inp.files[0]; if(!file) return;
    const data = await shrinkImage(file, 700);
    form_set(inp.dataset.img, data);
  }));
}
function form_set(key, data){
  const dlg = $('#dlg'); dlg.querySelector(`[name="${key}"]`).value = data;
  const w = $('#imgPrevWrap', dlg); if(!w) return;
  w.innerHTML = data ? `<img src="${data}" alt="">` : ''; w.style.display = data ? '' : 'none';
}
function shrinkImage(file, max){
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = img.width * s; cv.height = img.height * s;
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL('image/jpeg', 0.75));
    }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}

/* ============ 토스트 + 되돌리기 ============ */
let toastTimer, undoFn = null;
function toast(msg, btnText, fn){
  $('#toastMsg').textContent = msg;
  const b = $('#toastBtn'); b.textContent = btnText || ''; b.style.display = btnText ? '' : 'none';
  undoFn = fn || null;
  $('#toast').classList.add('show');

function counterForm(key, cid, preset){

    {key:'name', label:'이름', required:true, placeholder:'예: 단, 늘림, 줄임, 무늬 반복'},
    {key:'value', label:'현재 값', type:'number', step:'1'},
    {key:'target', label:'목표 값 (선택)', type:'number', step:'1', hint:'예: 목표 120단, 늘림 총 8번 → 도달하면 알려 드려요'},
    {key:'repeat', label:'몇 단마다? (선택)', type:'number', step:'1', hint:'예: 6단마다 늘림 → 6. 다음 늘림까지 몇 단 남았는지 보여 드려요'},
  ], c || Object.assign({name: p.counters.length ? '늘림' : '단', value:0}, preset), vals => {
    const v = {name: vals.name, value: Math.max(0, Math.round(num(vals.value))), target: Math.round(num(vals.target)), repeat: Math.round(num(vals.repeat))};
    if(c) Object.assign(c, v); else p.counters.push(Object.assign({id: uid()}, v));
    after();

    $('#delCounter').onclick = () => { const i = p.counters.indexOf(c); p.counters.splice(i,1); $('#dlg').close(); after();
      toast('카운터를 삭제했어요', '되돌리기', () => { p.counters.splice(i,0,c); after(); }); }; }
}

    for(const [id, data] of Object.entries(images)){ await idb.put('img:' + id, {data}).catch(() => {}); imgCache.set(id, data); }
    await putFiles(files);           /* 예전 형식(도안 포함 단일 백업) */
    const keep = new Set(db.patterns.map(p => p.fileId).filter(Boolean));
    old.patterns.forEach(p => { if(p.fileId && !keep.has(p.fileId)) idb.del(p.fileId).catch(() => {}); });
  }
  if(packs.length){ toast('도안 파일을 복원하는 중…'); for(const pk of packs) await putFiles(pk.files); }
  /* 백업 상태 바로잡기: 방금 불러온 기록·도안은 이미 백업 파일로 존재하는 것 */
  if(mains.length) db.settings.lastRecordBackup = Date.now();
  const restoredIds = new Set([...legacyFileIds, ...packs.flatMap(pk => Object.keys(pk.files))]);
  db.patterns.forEach(p => { if(p.fileId && restoredIds.has(p.fileId)) p.backedUp = p.fileId; });
  /* 다른 기기에서 만든 미리보기 참조는 이 기기에 없으니 다시 만들게 함 */
  for(const p of db.patterns) if(isRef(p.thumb) && !imgCache.has(p.thumb.slice(4)) && !(await idb.get('img:' + p.thumb.slice(4)).catch(() => null))) p.thumb = '';
  save(); applyTheme(); refresh();
  const have = await idb.all().catch(() => ({}));
  const missing = db.patterns.filter(p => p.fileId && !have[p.fileId]).length;
  toast((mains.length ? '기록을 불러왔어요. ' : '') + (restoredFiles ? `도안 ${restoredFiles}개 복원. ` : '') + (missing ? `파일이 없는 도안 ${missing}개는 도안 백업 파일도 불러와 주세요.` : ''));
});

/* ============ ☁️ 구글 드라이브 동기화 ============
   - 내 구글 드라이브의 '뜨개노트' 폴더에 기록(JSON)·사진·도안 파일을 저장해요.
   - 권한은 drive.file : 이 앱이 만든 파일만 볼 수 있어요 (다른 드라이브 파일은 못 봐요).
   - 항목마다 마지막 수정 시각(_u)을 비교해서, 더 나중에 고친 쪽으로 합쳐요.
   - 지운 항목은 '지운 기록(tombs)'으로 남겨 다른 기기에서도 지워지게 해요. */
const GD_CLIENT_ID = '180386550892-hre935basfu92vsia7t5072ttu5a1lp5.apps.googleusercontent.com';
const GD_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const GD_FOLDER = '뜨개노트';
const GD_DATA = 'knit-notes-data.json';
const SYNC_COLLS = ['projects','patterns','gauges','yarns','needles'];
const gd = { token: null, exp: 0, client: null, folderId: null, dataId: null, remoteMod: null, blobs: null, busy: false, again: false, state: 'off', last: 0, err: '' };

/* ---- 변경 추적: save() 때마다 무엇이 바뀌었는지 비교해서 _u(수정 시각)를 찍어요 ---- */
let snap = null;
function recJson(r){ const {_u, thumb, ...rest} = r; return JSON.stringify(rest); }
function takeSnap(){ snap = new Map(); SYNC_COLLS.forEach(c => db[c].forEach(r => snap.set(c + ':' + r.id, recJson(r)))); }
function stampChanges(){
  if(!snap){ takeSnap(); return; }
  const now = Date.now(), seen = new Set();
  db.tombs = db.tombs || {};
  SYNC_COLLS.forEach(c => db[c].forEach(r => {
    const k = c + ':' + r.id, j = recJson(r); seen.add(k);
    if(snap.get(k) !== j){ r._u = now; snap.set(k, j); delete db.tombs[k]; }
  }));
  for(const k of [...snap.keys()]) if(!seen.has(k)){ db.tombs[k] = now; snap.delete(k); }
}

/* ---- 합치기 ---- */
function mergeRemote(remote){
  const tombs = {...(remote.tombs || {})};
  for(const [k, t] of Object.entries(db.tombs || {})) tombs[k] = Math.max(tombs[k] || 0, t);
  /* 60일 지난 지운 기록은 정리 */
  const old = Date.now() - 60 * 864e5; for(const k in tombs) if(tombs[k] < old) delete tombs[k];
  let local = false, remoteDirty = JSON.stringify(tombs) !== JSON.stringify(remote.tombs || {});
  SYNC_COLLS.forEach(c => {
    const Lm = new Map(db[c].map(r => [r.id, r])), Rm = new Map((remote[c] || []).map(r => [r.id, r]));
    const order = [...Lm.keys(), ...[...Rm.keys()].filter(id => !Lm.has(id))];
    const out = [];
    for(const id of order){
      const l = Lm.get(id), r = Rm.get(id), t = tombs[c + ':' + id] || 0;
      let w = !l ? r : !r ? l : ((r._u || 0) > (l._u || 0) ? r : l);
      if((w._u || 0) <= t && t){ if(l) local = true; if(r) remoteDirty = true; continue; }
      const same = l && r && recJson(l) === recJson(r);
      if(w === r && !same) local = true;
      if(w === l && !same) remoteDirty = true;
      if(c === 'patterns') w = {...w, thumb: l ? l.thumb : ''};   /* 미리보기는 기기마다 따로 */
      out.push(w);
    }
    db[c] = out;
  });
  db.tombs = tombs;
  return {local, remote: remoteDirty};
}
function syncPayload(){
  const out = {v: 1, saved: Date.now(), tombs: db.tombs || {}};
  SYNC_COLLS.forEach(c => out[c] = db[c].map(r => { const {thumb, ...rest} = r; return rest; }));
  return out;
}

/* ---- 구글 로그인 (Google Identity Services 토큰 방식) ---- */
let gisReady = null;
function loadGis(){
  if(!gisReady) gisReady = loadScript('https://accounts.google.com/gsi/client').then(() => {
    gd.client = google.accounts.oauth2.initTokenClient({client_id: GD_CLIENT_ID, scope: GD_SCOPE, callback: () => {}});
  }).catch(e => { gisReady = null; throw e; });
  return gisReady;
}
function tokenValid(){ return gd.token && Date.now() < gd.exp - 60000; }
(function restoreToken(){ try{ const t = JSON.parse(localStorage.getItem('knit-gd-token') || 'null'); if(t && t.exp > Date.now()){ gd.token = t.token; gd.exp = t.exp; } }catch(e){} })();
async function gdAuth(prompt){
  await loadGis();
  return new Promise((res, rej) => {
    gd.client.callback = r => {
      if(r.error){ rej(r); return; }
      gd.token = r.access_token; gd.exp = Date.now() + (r.expires_in || 3600) * 1000;
      try{ localStorage.setItem('knit-gd-token', JSON.stringify({token: gd.token, exp: gd.exp})); }catch(e){}
      res(gd.token);
    };
    gd.client.error_callback = e => rej(e);
    gd.client.requestAccessToken({prompt});
  });
}
async function gdApi(url, opt = {}){
  if(!tokenValid()) throw Object.assign(new Error('reauth'), {reauth: true});
  const r = await fetch(url.startsWith('http') ? url : 'https://www.googleapis.com/drive/v3/' + url, {...opt, headers: {...(opt.headers || {}), Authorization: 'Bearer ' + gd.token}});
  if(r.status === 401){ gd.token = null; throw Object.assign(new Error('reauth'), {reauth: true}); }
  if(!r.ok) throw new Error('Drive ' + r.status + ' ' + (await r.text()).slice(0, 200));
  return r;
}
const q = s => encodeURIComponent(s);

/* ---- 드라이브 파일 다루기 ---- */
async function gdFolder(){
  if(gd.folderId) return gd.folderId;
  const r = await (await gdApi(`files?q=${q(`name='${GD_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id)&spaces=drive`)).json();
  if(r.files.length) return gd.folderId = r.files[0].id;
  const c = await (await gdApi('files?fields=id', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: GD_FOLDER, mimeType: 'application/vnd.google-apps.folder'})})).json();
  return gd.folderId = c.id;
}
async function gdList(){
  const folder = await gdFolder(), all = []; let page = '';
  do{
    const r = await (await gdApi(`files?q=${q(`'${folder}' in parents and trashed=false`)}&fields=nextPageToken,files(id,name,modifiedTime,appProperties,size)&pageSize=1000${page ? '&pageToken=' + page : ''}`)).json();
    all.push(...r.files); page = r.nextPageToken || '';
  }while(page);
  gd.blobs = new Map(); gd.dataId = null;
  for(const f of all){
    if(f.name === GD_DATA){ gd.dataId = f.id; gd.dataMod = f.modifiedTime; }
    else if(f.appProperties && f.appProperties.kid) gd.blobs.set(f.appProperties.kid, f);
  }
}
async function gdUpload(blob, name, kid, existingId){
  const meta = existingId ? {} : {name, parents: [await gdFolder()], appProperties: kid ? {kid} : undefined};
  const start = await gdApi(`https://www.googleapis.com/upload/drive/v3/files${existingId ? '/' + existingId : ''}?uploadType=resumable&fields=id,modifiedTime`, {
    method: existingId ? 'PATCH' : 'POST', headers: {'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Type': blob.type || 'application/octet-stream'}, body: JSON.stringify(meta)});
  const loc = start.headers.get('Location');
  const r = await fetch(loc, {method: 'PUT', headers: {'Content-Type': blob.type || 'application/octet-stream'}, body: blob});
  if(!r.ok) throw new Error('upload ' + r.status);
  return r.json();
}
async function gdDownload(id){ return (await gdApi(`files/${id}?alt=media`)).blob(); }

/* ---- 동기화 한 번 ---- */
async function syncNow(manual){
  if(!db.settings.gdOn || !GD_CLIENT_ID.includes('.apps.')) return;
  if(gd.busy){ gd.again = true; return; }
  if(!tokenValid()){ setSyncState('reauth'); return; }
  gd.busy = true; setSyncState('sync');
  try{
    await gdList();
    /* 1) 받아서 합치기 */
    let changedLocal = false, pushJson = !gd.dataId;
    if(gd.dataId){
      const remote = await (await gdApi(`files/${gd.dataId}?alt=media`)).json();
      const m = mergeRemote(remote);
      changedLocal = m.local; pushJson = m.remote;
      if(changedLocal){ persistLocal(); takeSnap(); afterRemoteChange(); }
    }
    /* 2) 이 기기에만 있는 도안·사진 올리기 */
    const kids = new Set();
    for(const p of db.patterns) if(p.fileId){
      kids.add(p.fileId);
      if(!gd.blobs.has(p.fileId)){
        const rec = await idb.get(p.fileId).catch(() => null);
        if(rec){ setSyncState('sync', `도안 올리는 중: ${p.name}`); const f = await gdUpload(rec.blob.type ? rec.blob : new Blob([rec.blob], {type: rec.type}), `도안_${p.name}_${p.fileId}${p.fileType === 'pdf' ? '.pdf' : '.jpg'}`, p.fileId); gd.blobs.set(p.fileId, {id: f.id, modifiedTime: f.modifiedTime}); }
      }
    }
    for(const p of db.projects) if(isRef(p.photo)){
      const k = 'img:' + p.photo.slice(4); kids.add(k);
      if(!gd.blobs.has(k)){
        const r = await idb.get(k).catch(() => null);
        if(r){ const f = await gdUpload(await dataURLToBlob(r.data), `사진_${p.name}_${p.photo.slice(4)}.jpg`, k); gd.blobs.set(k, {id: f.id, modifiedTime: f.modifiedTime}); }
        else if(gd.blobs.has(k)){ /* 아래에서 받음 */ }
      }
    }
    /* 3) 다른 기기에서 온 사진 받기 (작아서 바로 받아요) */
    for(const p of db.projects) if(isRef(p.photo)){
      const id = p.photo.slice(4), k = 'img:' + id;
      if(!(await idb.get(k).catch(() => null)) && gd.blobs.has(k)){
        const b = await gdDownload(gd.blobs.get(k).id); const data = await blobToDataURL(b);
        await idb.put(k, {data}); imgCache.set(id, data); changedLocal = true;
      }
    }
    /* 4) 기록 올리기 */
    if(pushJson){
      const blob = new Blob([JSON.stringify(syncPayload())], {type: 'application/json'});
      const f = await gdUpload(blob, GD_DATA, null, gd.dataId); gd.dataId = f.id;
    }
    /* 5) 어디에도 안 쓰이는 파일은 하루 지나면 휴지통으로 (복구 가능) */
    const dayAgo = Date.now() - 864e5;
    for(const [k, f] of gd.blobs) if(!kids.has(k) && f.modifiedTime && Date.parse(f.modifiedTime) < dayAgo){
      await gdApi(`files/${f.id}`, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({trashed: true})}).catch(() => {});
    }
    gd.last = Date.now(); db.settings.gdLast = gd.last; persistLocal();
    setSyncState('ok');
    if(changedLocal && location.hash.startsWith('#/patterns')) regenThumbs();
    if(manual) toast('동기화했어요 ☁️');
  }catch(e){
    if(e.reauth) setSyncState('reauth');
    else { gd.err = String(e.message || e); setSyncState('error'); if(manual) toast('동기화하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
  }finally{
    gd.busy = false;
    if(gd.again){ gd.again = false; setTimeout(() => syncNow(), 500); }
  }
}
/* 다른 기기에서 바뀐 내용이 들어오면 화면 갱신 (입력 중이면 잠시 미룸) */
function afterRemoteChange(){
  if($('#dlg').open || ['INPUT','TEXTAREA'].includes(document.activeElement && document.activeElement.tagName)){ gd.pendingRefresh = true; return; }
  if(!$('#viewer').hidden){ renderViewerCounter(); return; }
  refresh();
}
let syncT = null;
function scheduleSync(){ if(!db.settings.gdOn) return; clearTimeout(syncT); syncT = setTimeout(() => syncNow(), 3000); }
setInterval(() => { if(db.settings.gdOn && !document.hidden && tokenValid()) syncNow(); if(gd.pendingRefresh && !$('#dlg').open){ gd.pendingRefresh = false; afterRemoteChange(); } }, 45000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && db.settings.gdOn) syncNow(); });

/* ---- 상태 표시 (위쪽 구름 아이콘) ---- */
function setSyncState(s, msg){
  gd.state = s;
  const el = $('#syncBtn'); if(!el) return;
  const map = {off: ['', ''], ok: ['☁️', '동기화됨'], sync: ['🔄', msg || '동기화 중…'], reauth: ['⚠️', '눌러서 구글 드라이브 다시 연결'], error: ['⚠️', '동기화 오류 · 눌러서 다시 시도']};
  const [ico, tip] = map[s] || map.off;
  const si = $('#syncIcoSide'), stx = $('#syncTxtSide'); if(si){ si.textContent = ico; stx.textContent = tip; }
  el.hidden = !db.settings.gdOn; el.textContent = ico; el.title = tip; el.classList.toggle('spin', s === 'sync'); el.classList.toggle('warn', s === 'reauth' || s === 'error');
  const st = $('#gdStatus'); if(st) st.innerHTML = gdStatusText();
}
function gdStatusText(){
  if(gd.state === 'reauth') return '⚠️ 연결이 잠시 끊겼어요. <b>다시 연결</b>을 눌러 주세요.';
  if(gd.state === 'sync') return '🔄 동기화하는 중…';
  if(gd.state === 'error') return '⚠️ 동기화 오류: ' + esc(gd.err.slice(0, 80));
  const t = gd.last || db.settings.gdLast;
  return t ? `✅ 마지막 동기화: ${new Date(t).toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}` : '아직 동기화 전이에요';
}
async function gdConnect(){
  if(!GD_CLIENT_ID.includes('.apps.')) return toast('구글 드라이브 연결 준비가 아직 안 됐어요');
  try{
    await gdAuth(db.settings.gdOn ? '' : 'consent');
    db.settings.gdOn = true; persistLocal();
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
    refresh(); toast('구글 드라이브에 연결했어요. 동기화를 시작해요 ☁️');
    await syncNow(true);
  }catch(e){ toast('연결하지 못했어요. 팝업이 막혔다면 허용해 주세요.'); }
}
function gdDisconnect(){
  if(!confirm('구글 드라이브 연결을 해제할까요?\n이 기기의 기록과 드라이브의 파일은 그대로 남아요. 다시 연결하면 이어서 동기화돼요.')) return;
  try{ if(gd.token && window.google) google.accounts.oauth2.revoke(gd.token, () => {}); }catch(e){}
  gd.token = null; gd.folderId = null; db.settings.gdOn = false; persistLocal();
  try{ localStorage.removeItem('knit-gd-token'); }catch(e){}
  setSyncState('off'); refresh(); toast('연결을 해제했어요');
}
/* 이 기기에 없는 도안 파일을 드라이브에서 받기 */
async function gdFetchPattern(p){
  if(!db.settings.gdOn) return null;
  if(!tokenValid()) await gdAuth('');
  if(!gd.blobs) await gdList();
  const f = gd.blobs.get(p.fileId); if(!f) return null;
  toast('구글 드라이브에서 도안을 받는 중… ☁️');
  const blob = await gdDownload(f.id);
  const rec = {blob, name: p.fileName, type: blob.type || (p.fileType === 'pdf' ? 'application/pdf' : 'image/jpeg')};
  await idb.put(p.fileId, rec);
  return rec;
}
async function gdFetchAllPatterns(){
  const missing = [];
  for(const p of db.patterns) if(p.fileId && !(await idb.get(p.fileId).catch(() => null))) missing.push(p);
  if(!missing.length) return toast('모든 도안이 이미 이 기기에 있어요 👍');
  let n = 0;
  for(const p of missing){ try{ toast(`도안 받는 중… (${n + 1}/${missing.length})`); if(await gdFetchPattern(p)) n++; }catch(e){ break; } }
  toast(`도안 ${n}개를 이 기기에 받았어요. 이제 인터넷 없이도 볼 수 있어요`); refresh();
}

/* ============ 설치형 웹앱 (PWA) ============ */
let deferredInstall = null, swReady = false;
function isStandalone(){ return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true; }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('앱으로 설치했어요 🎉 홈 화면에서 열어 보세요'); });
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.serviceWorker.register('sw.js').then(reg => {
    swReady = true;
    /* 새 버전이 준비되면 알려 주기 */
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w && w.addEventListener('statechange', () => {
        if(w.state === 'installed' && navigator.serviceWorker.controller) toast('새 버전이 준비됐어요', '새로고침', () => location.reload());
      });
    });
  }).catch(() => {});
}
if(navigator.storage && navigator.storage.persist && isStandalone()) navigator.storage.persist();

$('.topbar .brand').innerHTML = mascot('happy', 32) + ' 뜨개 노트';
takeSnap();
route();
migrateImages();
setSyncState(db.settings.gdOn ? (tokenValid() ? 'ok' : 'reauth') : 'off');
if(db.settings.gdOn && tokenValid()) syncNow();
</script>
</body>
</html>
